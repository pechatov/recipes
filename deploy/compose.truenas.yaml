services:
  app:
    image: recipes:local
    restart: unless-stopped
    env_file:
      - /mnt/main-pool/config/recipes/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    ports:
      - "192.168.31.2:30111:8000"
    volumes:
      - /mnt/main-pool/config/recipes/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: recipes:local
    restart: unless-stopped
    command: ["python", "manage.py", "run_import_worker"]
    env_file:
      - /mnt/main-pool/config/recipes/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    volumes:
      - /mnt/main-pool/config/recipes/data:/app/data
    depends_on:
      app:
        condition: service_healthy

  cart-worker:
    image: recipes:local
    restart: unless-stopped
    command: ["python", "manage.py", "run_cart_worker"]
    env_file:
      - /mnt/main-pool/config/recipes/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    volumes:
      - /mnt/main-pool/config/recipes/data:/app/data
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /mnt/main-pool/config/recipes/.env
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
    volumes:
      - /mnt/main-pool/config/recipes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 10s
      timeout: 5s
      retries: 10
