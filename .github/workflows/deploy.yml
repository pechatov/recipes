name: Check, build and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.13"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        env:
          DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Test
        env:
          DEBUG: "true"
        run: python manage.py test

  build:
    name: Build image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: version
        run: echo "image-tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to TrueNAS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - recipes-truenas-deploy
    timeout-minutes: 15
    concurrency:
      group: recipes-production
      cancel-in-progress: false
    env:
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      RECIPES_APP_ROOT: ${{ vars.RECIPES_APP_ROOT }}
      RECIPES_IMAGE: ghcr.io/${{ github.repository }}
      RECIPES_TAG: ${{ needs.build.outputs.image-tag }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy variables
        run: |
          test -n "$DEPLOY_SSH_TARGET"
          test -n "$RECIPES_APP_ROOT"

      - name: Deploy immutable image
        run: scripts/deploy/truenas-ghcr-deploy.sh
