<div class="repeatable-card formset-row">
  {{ step.id }}
  <div class="step-form-heading">
    <span class="formset-number">Шаг</span>
    {% if step.DELETE %}<label class="delete-control">{{ step.DELETE }} Удалить шаг</label>{% endif %}
  </div>
  <div class="form-grid">
    {% include "recipes/_form_field.html" with field=step.title %}
    {% include "recipes/_form_field.html" with field=step.instruction %}
    {% include "recipes/_form_field.html" with field=step.image %}
  </div>
</div>
